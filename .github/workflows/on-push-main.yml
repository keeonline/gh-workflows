name: Reusable on push main

on:
    workflow_call:

jobs:
    main-branch-push:
        name: Main Push
        runs-on: ubuntu-24.04
        steps:
            - name: Get artifact version
              id: version
              uses: keeonline/gh-actions/actions/artifact-version@v0.0.8

            - name: Output values
              run: |
                echo "value=${{steps.version.outputs.value}}"
                echo "projected_release=${{steps.version.outputs.projected_release}}"

            - name: Tag repo
              uses: richardsimko/update-tag@v1.1.6
              with:
                tag_name: ${{steps.version.outputs.value}}
              env:
                GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

